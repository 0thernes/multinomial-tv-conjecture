name: Feature or verification request
description: Suggest an addition, extra theorem, or verification improvement.
labels: ["triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I read ROADMAP.md, including "Not Planned".
          required: true
