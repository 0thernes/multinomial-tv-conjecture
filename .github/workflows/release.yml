name: Release Checksums & SLSA Provenance Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect release artifacts and generate SHA256SUMS
        run: |
          mkdir -p release-dist
          cp dist/Donahue_2026_Conjecture_7_7_Multinomial_TV.pdf release-dist/
          cp dist/arxiv_submission.tar.gz release-dist/
          cp results/lean-axioms-all.log release-dist/
          cp results/comparator-paranoid.log release-dist/
          cp data/MANIFEST.sha256 release-dist/data-MANIFEST.sha256
          (cd release-dist && sha256sum * > SHA256SUMS)
          cat release-dist/SHA256SUMS
      - name: Generate Sigstore SLSA build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-dist/*
      - name: Publish GitHub Release with SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-dist/* \
            --title "Multinomial TV Conjecture $TAG" \
            --notes "Lean 4.35.0 6-kernel verified proof of Conjecture 7.7 ($TAG) with frozen PDF, byte-reproducible arXiv bundle, SHA256SUMS, and Sigstore SLSA provenance attestations. See CHANGELOG.md for details." \
            || gh release upload "$TAG" release-dist/* --clobber
