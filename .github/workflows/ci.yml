name: CI (Cross-Platform Tests, Audits & Linters)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Tests & Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run independent exact rational & 80-digit verifier
        run: python scripts/verify_conjecture.py
      - name: Run full pytest ladder
        run: python -m pytest -v tests/
      - name: Run citation, axiom-sync, Blueprint, site, and manifest audits
        run: |
          python scripts/check_citations.py
          python scripts/check_readme_axioms.py --require-exhaustive
          python scripts/build_blueprint.py
          python scripts/build_site.py
          python scripts/generate_manifest.py --verify

  lint-and-audit:
    name: Report-Only Linters, Security & Build Standard Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Report-only linters (ruff & mypy)
        continue-on-error: true
        run: |
          python -m ruff check scripts/ tests/
          python -m mypy --ignore-missing-imports scripts/
      - name: Build Standard v1.2.0 repo audit
        run: bash scripts/audit-repo.sh .
      - name: Secret scan (gitleaks, report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
