name: Lean 4.35.0 Formal Verification & Comparator Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-verify:
    name: Build, Axiom Audit, Batteries Linter & Comparator (6 Checker Runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install bubblewrap for sandboxed lake comparator
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Fetch pinned Mathlib cache & build library, Challenge, Solution, VerifyAxioms
        working-directory: lean
        run: |
          lake exe cache get
          lake build MultinomialTVConjecture Challenge Solution VerifyAxioms
      - name: Forbidden-token & zero-nolint scan (scripts/check_lean_tokens.py)
        run: python3 scripts/check_lean_tokens.py
      - name: "Run exhaustive #print axioms & theorem+definition audit (VerifyAxioms.lean)"
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyAxioms.lean | tee ../results/lean-axioms-ci.log
      - name: Verify live CI axiom log & committed README sync
        run: |
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-ci.log --require-exhaustive
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-all.log --require-exhaustive
      - name: Run Batteries linter (report-only)
        working-directory: lean
        continue-on-error: true
        run: lake exe runLinter MultinomialTVConjecture
      - name: Elaboration smoke test (mutated constant aTriangle = 1/32 fails with unsolved goals)
        working-directory: lean
        shell: bash
        run: |
          # Note: the actual kernel-checked refutation of aTriangle = 1/32 is the proved theorem
          # `MultinomialTV.NonVacuity.adversarial_aTriangle_ne_one_div_32`; this CI step is an
          # elaboration smoke test verifying that a standalone mutated goal fails with unsolved goals.
          cat <<'EOF' > /tmp/neg_smoke_test.lean
          import MultinomialTVConjecture.Main
          theorem mutated_aTriangle_must_fail : MultinomialTV.aTriangle = 1 / 32 := by
            rw [MultinomialTV.conjecture_7_7_aTriangle]
            norm_num
          EOF
          OUT=$(lake env lean /tmp/neg_smoke_test.lean 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -q "unsolved goals"; then
            echo "PASS: Elaboration smoke test failed with expected 'unsolved goals' on mutated constant."
          else
            echo "ERROR: Expected 'unsolved goals' on mutated constant smoke test!" >&2
            exit 1
          fi
          rm -f /tmp/neg_smoke_test.lean
      - name: Replay NonVacuity.lean independently via leanchecker
        working-directory: lean
        run: lake env leanchecker MultinomialTVConjecture.NonVacuity
      - name: Run sandboxed lake comparator --paranoid (six checker runs)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid | tee ../results/comparator-paranoid-ci.log
      - name: Negative comparator tamper test (sorry-injected Solution.lean must be rejected)
        working-directory: lean
        shell: bash
        run: |
          cp Solution.lean /tmp/Solution.lean.bak
          trap 'mv -f /tmp/Solution.lean.bak Solution.lean' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Solution.lean")
          src = p.read_text(encoding="utf-8")
          old = "  exact MultinomialTV.conjecture_7_7"
          assert old in src, "Expected target_conjecture_7_7 body in Solution.lean"
          p.write_text(src.replace(old, "  sorry", 1), encoding="utf-8", newline="\n")
          PY
          lake build Solution
          set +e
          NEG_OUT=$(lake comparator --config comparator.json --paranoid 2>&1)
          NEG_RC=$?
          set -e
          echo "$NEG_OUT"
          if [ "$NEG_RC" -eq 0 ]; then
            echo "ERROR: lake comparator --paranoid accepted a sorry-tampered Solution.lean!" >&2
            exit 1
          fi
          echo "PASS: Negative comparator tamper test rejected sorry-injected Solution.lean (exit $NEG_RC)."
      - name: Attest Lean axiom & comparator reports (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            results/lean-axioms-ci.log
            results/comparator-paranoid-ci.log
