fidelity:
  divergences: >-
    Targets 1-4 and 9 formalize Lemma 7.3 (strengthened to uniform O(L^-2) remainder)
    and Conjecture 7.7 directly from the verbatim nested multinomial sum hAdj(L) =
    E[|X_2 - X_1| |X_3 - X_2|] under Mult(L; 1/3, 1/3, 1/3). Targets 5-8 and 10 formalize
    only the algebraic recombination identities for gamma(n), gamma_c(n), gamma(3;N), and
    gamma(4;N); the upstream variance decompositions linking those constants to Var(D_N)
    remain unformalized and cited from unrefereed preprints arXiv:2610.17046v1 and
    arXiv:2611.14735v1. Full line-by-line mapping is in docs/statement-fidelity.md.

