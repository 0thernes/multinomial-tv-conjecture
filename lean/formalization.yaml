project:
  name: "Proof of Conjecture 7.7 and Quantitative O(L^-2) Remainder of Lemma 7.3 for Multinomial Discrete Total Variation"
  description: >-
    Lean 4.35.0 / Mathlib v4.35.0 formalization resolving Conjecture 7.7 and the
    quantitative O(L^-2) remainder of Lemma 7.3 of Nikola Banić and Neven Elezović
    (Discrete total variation under the multinomial, Part 2: variance under the uniform null,
    arXiv:2610.17046v1). Across 10 isolated Mathlib-only Palomar Comparator targets
    (backed by 191 author-written theorems and lemmas, 896 audited theorem constants +
    65 audited definitions, 0 @[nolint] suppressions, and 22 NonVacuity theorems):
    (1) proves the residue-class 1/L asymptotic limits b_0 = 32*sqrt(3)/(81*pi) and
    b_1 = b_2 = -22*sqrt(3)/(81*pi) for the adjacent multinomial expectation h_adj(L) =
    E[|X_2 - X_1| |X_3 - X_2|] under Mult(L; 1/3, 1/3, 1/3) via exact 2D-to-1D combinatorial
    reduction, refined Stirling asymptotics, and 3rd/4th-order Gaussian Euler-Maclaurin
    summation; (2) proves the quantitative O(L^-2) remainder bound (Lemma 7.3); (3) establishes
    the exact closed forms a_triangle = 1/32 - 4*sqrt(3)/243 and gamma_2 =
    -1/(32*pi) - 8*sqrt(3)/(243*pi) (Conjecture 7.7); and (4) certifies five exact
    algebraic recombination identities for linear gamma(n), cyclic gamma_c(n),
    gamma(3;N) (including literal Part 2 §7.2 source form), and gamma(4;N). The
    upstream variance-transfer decomposition lemmas (Theorem 7.6 and §7.2/§8 of
    arXiv:2610.17046v1; Theorem 3.10 of arXiv:2611.14735v1) are cited from the source
    preprints and lie outside the Lean 4 proof boundary.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
