name = "MultinomialTVConjecture"
version = "2.3.0"
defaultTargets = ["MultinomialTVConjecture", "Solution"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Enable Mathlib standard style linter set (Playbook v1.3 #5); allow >100-col dense algebra lines
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "MultinomialTVConjecture"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "VerifyAxioms"
